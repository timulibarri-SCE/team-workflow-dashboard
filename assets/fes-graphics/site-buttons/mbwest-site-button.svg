<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120" role="img" aria-labelledby="title desc">
  <title id="title">MBwest site button</title>
  <desc id="desc">Facilities ES site button for MBwest using Exo 2. The first 25 percent is reserved for the site icon.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#102420" stop-opacity="0.92" />
      <stop offset="0.55" stop-color="#0A1B18" stop-opacity="0.94" />
      <stop offset="1" stop-color="#06110F" stop-opacity="0.98" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="#7CB342" stop-opacity="0.22" />
      <stop offset="0.62" stop-color="#7CB342" stop-opacity="0.08" />
      <stop offset="1" stop-color="#7CB342" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#AED581" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Exo+2:wght@700;800&amp;display=swap");
      .site-name { font-family: "Exo 2", Inter, Arial, sans-serif; font-weight: 800; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="480" height="120" rx="18" fill="url(#panel)" />
  <rect width="480" height="120" rx="18" fill="url(#grid)" opacity="0.62" />
  <circle cx="70" cy="41" r="54" fill="url(#glow)" />
  <image href="data:image/svg+xml;base64," x="19" y="19" width="82" height="82" preserveAspectRatio="xMidYMid meet" />
  <text x="148" y="72" class="site-name" fill="#FFFFFF" font-size="42">MBwest</text>
  <rect x="150" y="86" width="92" height="5" rx="3" fill="#7CB342" />
</svg>
