  <rect x="1" y="1" width="358" height="94" rx="16" fill="url(#panel)" stroke="#AED581" stroke-opacity="0.28" stroke-width="2" />
  <rect x="2" y="2" width="356" height="92" rx="15" fill="url(#grid)" opacity="0.48" />
  <circle cx="48" cy="48" r="44" fill="url(#glow)" opacity="0.76" />
  
    <g>
      <rect x="18" y="18" width="60" height="60" rx="11" fill="url(#tile)" fill-opacity="1" stroke="#AED581" stroke-opacity="0.28" stroke-width="1.4" />
      <circle cx="63.6" cy="32.4" r="20.400000000000002" fill="url(#glow)" />
      <g transform="translate(8.625 8.625) scale(0.7875)">
        
        <path d="M20 58a30 30 0 1 1 60 0" fill="none" stroke="#7CB342" stroke-width="7" stroke-linecap="round" />
        <path d="M31 58h38" stroke="#7CB342" stroke-width="7" stroke-linecap="round" />
        <path d="M50 57 69 36" stroke="#AED581" stroke-width="7" stroke-linecap="round" filter="url(#lime-glow)" />
        <circle cx="50" cy="58" r="6" fill="#AED581" />
        <path d="M30 50l-5-3M40 35l-3-5M60 35l3-5M70 50l5-3" stroke="#AED581" stroke-width="4" stroke-linecap="round" opacity="0.78" />
      </g>
    </g>
