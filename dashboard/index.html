<!doctype html>
<html lang="en" class="require-auth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/favicon.ico?v=frog-tab-1" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png?v=frog-tab-1">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png?v=frog-tab-1">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=frog-tab-1">
    <title>Facilities ES | Dashboard</title>
    <link rel="stylesheet" href="styles.css?v=facilities-es-dashboard-2" />
    <style>
      .require-auth body {
        display: none;
      }
    </style>
    <script src="../scripts/access-directory.js?v=facilities-os-1"></script>
    <script>
      if (AccessDirectory.requirePageAccess("dashboard", "../login/?redirect=../dashboard/")) {
        document.documentElement.classList.remove("require-auth");
      }
    </script>
  </head>
  <body>
    <header class="page-header" aria-label="Dashboard header">
      <h1>Dashboard</h1>
      <div class="header-actions">
        <a class="header-icon-button settings-icon" href="../settings/" aria-label="Settings">
          <img src="assets/fes-graphics/icons/administration-icon.svg" alt="" />
        </a>
        <button class="header-icon-button logout-icon" id="logoutButton" type="button" aria-label="Log out"></button>
      </div>
    </header>

    <main class="site-directory" id="dashboard" aria-label="Facilities ES site modules">
      <div id="siteDirectory"></div>
    </main>

    <script src="app.js?v=facilities-es-dashboard-2"></script>
  </body>
</html>
