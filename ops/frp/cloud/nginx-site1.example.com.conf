# Replace site1.example.com and certificate paths before enabling.
# Include ops/frp/cloud/nginx-http-map.conf once in the nginx http{} context.

server {
    listen 80;
    server_name site1.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name site1.example.com;

    ssl_certificate /etc/letsencrypt/live/site1.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site1.example.com/privkey.pem;

    access_log /var/log/nginx/site1.example.com.access.log;
    error_log /var/log/nginx/site1.example.com.error.log warn;

    # If Authentik is already available, add the server-level locations from
    # nginx-authentik-forward-auth.example.conf and protect this location with
    # its auth_request directives before exposing any real controls.
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
