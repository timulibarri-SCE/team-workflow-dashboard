# Optional same-domain route for the existing Facilities Engineering frontend.
# Use this shape when the browser must stay on:
#   https://www.facilities-engineering.com/lion-HopVAC/
# and the iframe must load:
#   /lion-hopvac-proxy/
#
# For this route, set FRP_PUBLIC_HOST=www.facilities-engineering.com in the
# matching frpc site env file. Nginx sends only this path to frps, while the
# rest of the website can be served by the normal frontend upstream.

server {
    listen 443 ssl http2;
    server_name www.facilities-engineering.com;

    ssl_certificate /etc/letsencrypt/live/www.facilities-engineering.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.facilities-engineering.com/privkey.pem;

    # Existing static site/app routes go here.
    # location / {
    #     proxy_pass http://127.0.0.1:3000;
    # }

    # Backwards compatibility for older mixed-case links.
    location = /Lion-HopVAC {
        return 301 /lion-HopVAC/;
    }

    location = /Lion-HopVAC/ {
        return 301 /lion-HopVAC/;
    }

    location = /lion-hopvac {
        return 301 /lion-HopVAC/;
    }

    location = /lion-hopvac/ {
        return 301 /lion-HopVAC/;
    }

    # Protect this location with Authentik or the main application auth before
    # connecting it to any real building controls.
    location /lion-hopvac-proxy/ {
        proxy_pass http://127.0.0.1:8088/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
